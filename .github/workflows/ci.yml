name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: madeireira
          POSTGRES_PASSWORD: madeireira
          POSTGRES_DB: madeireira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madeireira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://madeireira:madeireira@localhost:5432/madeireira?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Lint
        run: npm run lint:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Check schema has no unmigrated changes
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      # O smoke test conta com os dados do seed (ex.: clientes com endereço em Jundiaí
      # para a Rota do dia), então o banco vazio do CI é populado antes.
      # Geocodificação e rotas vão para o mock local (scripts/mock-geo.mjs), não para a internet.
      - name: Seed + smoke test (API + Postgres + mock-geo)
        env:
          NOMINATIM_URL: http://localhost:3999
          PHOTON_URL: http://localhost:3999
          OSRM_URL: http://localhost:3999
        run: |
          node scripts/mock-geo.mjs > mock-geo.log 2>&1 &
          node dist/main > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/docs > /dev/null && break
            sleep 1
          done
          node scripts/seed.mjs
          node scripts/smoke.mjs
      - name: API log
        if: failure()
        run: cat api.log mock-geo.log || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
